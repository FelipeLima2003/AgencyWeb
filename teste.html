<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: aqua;
        }

        h1 {
            color: yellow;
            font-size: 100px;
            letter-spacing: 30px;
        }

        @media (max-width: 884px) {
            body {
                background-color: purple
            }

            h1 {
                font-size: 30px;
                color: aliceblue;
            }
        }

        @media (max-width: 480px) {
            body {
                background-color: red;
            }

            h1 {
                font-size: 10px;
                color: green;
            }
        }
        
        
    </style>

</head>

<body>
    <h1>Titulo</h1>
</body>

</html>
